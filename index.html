<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckerAI | Free AI Checker &amp; AI Detector</title>
  <meta name="description" content="CheckerAI is a free AI checker and AI detector that flags signs of AI writing from ChatGPT, GPT, Claude, and Gemini, with an overall score and highlighted passages. No sign-up required.">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #111827;
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    section {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #bae6fd;
      border-radius: 24px;
      padding: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .brand img {
      width: 56px;
      height: 56px;
      margin: 0;
      border-radius: 12px;
      border: 0;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 76px);
      line-height: 0.94;
    }
    p {
      line-height: 1.6;
      color: #475569;
      font-size: 18px;
    }
    .actions {
      margin-top: 24px;
    }
    .actions a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 999px;
      text-decoration: none;
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      border: 1px solid #0284c7;
    }
    img.screenshot {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 24px;
      border-radius: 18px;
      border: 1px solid #bae6fd;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="brand">
        <img src="logo.png" alt="CheckerAI logo">
        <h1>CheckerAI</h1>
      </div>
      <p>CheckerAI is a free AI checker and AI detector that flags signs of AI writing from ChatGPT, GPT, Claude, and Gemini, with an overall score and highlighted passages. No sign-up required.</p>
      <div class="actions">
        <a href="https://checkerai.io/">Try CheckerAI</a>
      </div>
      <img class="screenshot" src="home-en.png" alt="CheckerAI interface preview">
    </section>
  </main>
</body>
</html>
